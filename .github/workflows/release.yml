name: Release
on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
    branches: [main]
    paths: [manifest.json, .github/workflows/release.yml]
  workflow_dispatch:
concurrency:
  group: plugin-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        uses: actions/github-script@v7
        with:
          script: |
            const manifest = JSON.parse(require('node:fs').readFileSync('manifest.json', 'utf8'));
            if (!/^\d+\.\d+\.\d+$/.test(manifest.version)) throw new Error('Invalid manifest version.');
            if (context.ref.startsWith('refs/tags/') && context.ref.slice(10) !== manifest.version) throw new Error('Tag must match manifest.version.');
            core.setOutput('version', manifest.version);
            try {
              const { data } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag: manifest.version });
              core.setOutput('publish', String(data.draft));
              if (!data.draft) core.notice(`Release ${manifest.version} already exists; skipping publication.`);
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('publish', 'true');
            }
  verify:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
  release:
    needs: [prepare, verify]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run package
      - name: Attest installation assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Publish checked release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare.outputs.version }} - Screen and File QA
          draft: false
          body_path: docs/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            main.js
            manifest.json
            styles.css
            LICENSE
            THIRD_PARTY_LICENSES.md
            dist/*-plugin-*.zip
            dist/*-source-*.zip
            dist/SHA256SUMS.txt
      # Requested one-time cleanup: keep the newly checked release and commit/tag
      # history. Exact release IDs prevent later releases from being deleted.
      - name: Remove superseded releases after 0.14.0 is published
        if: needs.prepare.outputs.version == '0.14.0'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: latest } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag: '0.14.0' });
            if (latest.draft || latest.prerelease) throw new Error('Latest release is not published.');
            for (const name of ['main.js', 'manifest.json', 'styles.css']) {
              if (!latest.assets.some(asset => asset.name === name && asset.size > 0)) throw new Error(`Missing ${name}`);
            }
            const old = [398342549];
            for (const release_id of old) {
              try {
                const { data: release } = await github.rest.repos.getRelease({ ...context.repo, release_id });
                if (!['0.13.7'].includes(release.tag_name)) throw new Error('Unexpected release identity.');
                await github.rest.repos.deleteRelease({ ...context.repo, release_id });
                core.notice(`Deleted superseded release ${release.tag_name}; tag and commits retained.`);
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
